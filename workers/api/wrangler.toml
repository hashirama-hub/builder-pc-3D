# workers/api/wrangler.toml — Cloudflare Worker API (Hono)
name = "pc-builder-api"
main = "index.ts"
compatibility_date = "2026-09-01"

# D1 binding (products + builds).
# TODO: create it once — `npx wrangler d1 create PC_BUILDER_DB` — then uncomment
# `id` below and paste the returned database id. No id is invented here on purpose.
[[d1_databases]]
binding = "DB"
database_name = "PC_BUILDER_DB"
# id = "<TODO: paste database_id from `npx wrangler d1 create PC_BUILDER_DB`>"

# Apply the schema / seed (local dev state lives in workers/api/.wrangler/state):
#   npx wrangler d1 execute PC_BUILDER_DB --local --file ../../db/schema.sql
#   npm run seed        (repo root — schema + db/seed.sql, local)
#   npm run seed:remote (repo root — needs the D1 id above)

# KV binding (rate limiter, 100 req/min per IP).
# TODO: create it once — `npx wrangler kv namespace create pc-builder-rl` — then
# uncomment `id` below and paste the returned namespace id.
[[kv_namespaces]]
binding = "KV"
# id = "<TODO: paste id from `npx wrangler kv namespace create pc-builder-rl`>"

# Secrets / vars (none required yet):
# [vars]
# ENVIRONMENT = "production"

# Deploy:  npm run deploy:api   (repo root)  /  npm run deploy  (workers/api)
# Bundles without uploading:    npx wrangler deploy --dry-run
