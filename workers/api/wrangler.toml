# workers/api/wrangler.toml — Cloudflare Worker API (Hono)
name = "pc-builder-api"
main = "index.ts"
compatibility_date = "2026-09-01"

# D1 binding (products + builds).
[[d1_databases]]
binding = "DB"
database_name = "PC_BUILDER_DB"
id = "dc2d57c8-1015-4448-8f09-03bcad32df87"

# Apply the schema / seed (local dev state lives in workers/api/.wrangler/state):
#   npx wrangler d1 execute PC_BUILDER_DB --local --file ../../db/schema.sql
#   npm run seed        (repo root — schema + db/seed.sql, local)
#   npm run seed:remote (repo root — needs the D1 id above)

# KV binding (rate limiter, 100 req/min per IP).
[[kv_namespaces]]
binding = "KV"
id = "4a522a0480ff4a38ab1126437bac1099"

# Secrets / vars (none required yet):
# [vars]
# ENVIRONMENT = "production"

# Deploy:  npm run deploy:api   (repo root)  /  npm run deploy  (workers/api)
# Bundles without uploading:    npx wrangler deploy --dry-run
